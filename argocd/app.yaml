apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopping-mall
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/jwahn2018-rgb/5x5y-shop
    targetRevision: min-test
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  
  revisionHistoryLimit: 3

